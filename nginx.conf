# Port 80 serves the user site (dist/), port 8080 serves the admin site (dist-admin/) — one
# image, one container, both bundles built in the same `docker build` (see Dockerfile). Shared
# rules (gateway proxying, caching, SPA fallback) live in nginx-common.conf.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/common.conf;
}
    charset utf-8;

    # Re-resolve the backend container through Docker's embedded DNS instead of caching
    # its IP at startup, so recreating the backend doesn't leave nginx proxying to a dead IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;
    set $gateway_upstream gateway:8088;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/admin;
    index index.html;

    include /etc/nginx/common.conf;
}

    # Chat streaming (SSE): tắt buffer/gzip để từng event tới trình duyệt ngay.
    # Dùng exact match (=) vì được ưu tiên hơn cả ^~ /api/api/ ở trên.
    location = /api/v1/chat/stream {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Đường dẫn bị lặp /api/api/ (khi VITE_API_BASE_URL kết thúc bằng /api).
    location = /api/api/v1/chat/stream {
        rewrite ^ /api/v1/chat/stream break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification service qua API gateway (Spring Cloud Gateway, port 8088).
    # SSE stream: exact match, tắt buffer/gzip, read timeout dài (heartbeat ~25s).
    location = /jobbeacon-notification/api/v1/me/notifications/stream {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /jobbeacon-notification/ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}