# Shared between the user-site and admin server blocks in nginx.conf — keep both in sync by
# editing here instead of duplicating rules per server.

charset utf-8;

# /jobbeacon-be/ and /jobbeacon-recommendation/ go through the gateway, which verifies the
# Firebase token and adds X-User-* headers. Re-resolve the gateway container through Docker's
# embedded DNS instead of caching its IP at startup, so recreating it doesn't leave nginx
# proxying to a dead IP (502).
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream gateway:8088;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/plain;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Chat streaming (SSE): turn off buffering/gzip so each event reaches the browser right away.
# Exact match (=) so it wins over the prefix (^~) rule below.
location = /jobbeacon-be/api/v1/chat/stream {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Each service's API lives under its own name (context path); the gateway forwards the path as-is.
location ^~ /jobbeacon-be/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /jobbeacon-recommendation/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}

location ~ /\. {
    deny all;
}
