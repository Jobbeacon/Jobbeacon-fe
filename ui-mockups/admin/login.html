<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · Quản trị JobBeacon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23163E70'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%231687FF' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="gate" data-page="login">
  <main class="gate-card">
    <img src="assets/logo.svg" alt="JobBeacon">
    <h1>Quản trị</h1>
    <p class="lead">Vào bảng vận hành nền tảng. Đây không phải cửa đăng nhập của người tìm việc.</p>
    <form id="login-form">
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" required placeholder="ten@jobbeacon.vn"></label>
      <label class="field"><span>Mật khẩu</span><input name="password" type="password" autocomplete="current-password" required placeholder="Ít nhất 4 ký tự"></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn" type="submit">Vào bảng điều khiển</button>
    </form>
    <p class="fine">Bản xem trước (demo): minh.anh@jobbeacon.vn / admin. Trong hệ thống thật, tài khoản quản trị và người dùng đều xác thực qua Firebase — không có mật khẩu nào hiển thị ở đây.</p>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
