<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Công ty · Quản trị JobBeacon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23163E70'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%231687FF' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="companies">
  <header class="top">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="JobBeacon"></a>
    <nav class="nav">
      <a href="index.html">Tổng quan</a>
      <a href="jobs.html">Việc làm</a>
      <a href="companies.html" aria-current="page">Công ty</a>
      <a href="users.html">Người dùng</a>
      <a href="sources.html">Nguồn</a>
      <a href="catalog.html">Danh mục</a>
    </nav>
    <span class="top-meta">19 tháng 10, 2026 · <a href="login.html">Thoát</a></span>
  </header>
  <main class="stage">
      <header class="stage-head">
        <div>
          <h1>Công ty</h1>
          <p class="lead">Sửa tên và logo. Số tin và lần crawl gần nhất lấy từ dữ liệu việc làm.</p>
        </div>
      </header>
      <section class="sheet">
        <div class="toolbar">
          <div class="filters">
            <label class="field"><span>Tìm</span><input id="company-q" type="search" placeholder="Tên công ty"></label>
          </div>
          <p class="count" id="company-count"></p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Công ty</th>
                <th>Số tin</th>
                <th>Nguồn gặp</th>
                <th>Crawl gần nhất</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="company-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

  <dialog class="editor" id="editor">
    <form id="company-form" spellcheck="false">
      <div class="editor-bar"><h2>Sửa công ty</h2></div>
      <div class="editor-body">
        <div class="identity">
          <span class="mono-mark lg" id="logo-preview">CT</span>
          <div>
            <strong id="company-preview-name">Công ty</strong>
            <p class="fine" id="company-facts"></p>
          </div>
        </div>
        <label class="field"><span>Tên</span><input name="name" required maxlength="255"></label>
        <label class="field"><span>Logo</span><input name="logo" type="url" placeholder="https://"></label>
      </div>
      <div class="editor-actions">
        <button class="btn ghost" type="button" data-close>Hủy</button>
        <button class="btn" type="submit">Lưu</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="confirm">
    <form method="dialog">
      <div class="modal-bar"><h2>Gỡ công ty này?</h2></div>
      <p></p>
      <div class="modal-actions">
        <button class="btn ghost" value="cancel">Giữ lại</button>
        <button class="btn danger" value="ok">Xóa</button>
      </div>
    </form>
  </dialog>
  <script src="js/admin.js"></script>
</body>
</html>
